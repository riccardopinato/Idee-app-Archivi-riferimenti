name: Anna 58 capability evaluation admission — one-shot generator

on:
  push:
    branches:
      - audit/anna-58-evaluation-admissions-20261104
    paths:
      - ".audit/anna-58-one-shot-trigger.txt"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout audited branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/anna-58-evaluation-admissions-20261104
          persist-credentials: true

      - name: Admit exactly six and rebuild all catalogue views
        run: |
          python3 scripts/admit_anna_evaluation_20261104.py
          python3 scripts/build_catalog.py
          python3 scripts/build_catalog.py --check
          python3 -m unittest discover -s tests -p 'anna_evaluation_admission_test.py' -v
          python3 -m unittest discover -s tests -p 'capability_registry_test.py' -v
          python3 -m unittest discover -s tests -p 'status_views_test.py' -v

      - name: Commit canonical admissions and synchronized generated views
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 12-CAPABILITY-E-IMPLEMENTAZIONI/ DA_VALUTARE.md GIA_INTEGRATI.md
          if ! git diff --cached --quiet; then
            git commit -m "docs(catalog): regenerate audited Anna 14/8/52 evaluation queues"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
