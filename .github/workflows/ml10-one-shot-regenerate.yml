name: ML10 one-shot catalogue generated views (audit branch)

on:
  push:
    branches:
      - audit/ml10-full-catalog-20261104
    paths:
      - scripts/audit_catalog_ml10_20261104.py
      - .github/workflows/ml10-one-shot-regenerate.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: audit/ml10-full-catalog-20261104
      - name: Rescore all canonical entries and derive every view
        run: |
          python3 scripts/audit_catalog_ml10_20261104.py
          python3 scripts/build_catalog.py
          python3 scripts/build_catalog.py --check
          python3 -m unittest discover -s tests -p 'capability_registry_test.py' -v
          python3 -m unittest discover -s tests -p 'status_views_test.py' -v
      - name: Commit generated files only to audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 12-CAPABILITY-E-IMPLEMENTAZIONI/ 13-KIT-INTEGRAZIONE/ DA_VALUTARE.md GIA_INTEGRATI.md
          if ! git diff --cached --quiet; then
            git commit -m "docs(catalog): regenerate complete 160 CAP / 385 app-link audited views"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
