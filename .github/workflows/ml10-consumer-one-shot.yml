name: ML10 Consumer Evidence — One-shot Regenerate

on:
  push:
    branches: [audit/ml10-consumers-postmerge-20261104]
    paths:
      - ".ml10/trigger-regeneration.txt"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/ml10-consumers-postmerge-20261104
          persist-credentials: true

      - name: Apply gated consumer proof and regenerate canonical views
        run: |
          python3 scripts/reconcile_ml10_consumers_20261104.py
          python3 scripts/build_catalog.py
          python3 scripts/build_catalog.py --check
          python3 -m unittest discover -s tests -p 'capability_registry_test.py' -v
          python3 -m unittest discover -s tests -p 'status_views_test.py' -v

      - name: Commit audited canonical updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 12-CAPABILITY-E-IMPLEMENTAZIONI/ DA_VALUTARE.md GIA_INTEGRATI.md
          if ! git diff --cached --quiet; then
            git commit -m "docs(catalog): regenerate Notes and TasteAI scoped consumer evidence"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
