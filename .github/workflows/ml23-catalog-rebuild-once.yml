name: One-time ML23 capability admission rebuild
on:
  push:
    branches: [feat/ml23-capabilities-golden-roadmap-20261104]
    paths:
      - scripts/admit_ml23_capabilities_20261104.py
      - .github/workflows/ml23-catalog-rebuild-once.yml
permissions:
  contents: write
jobs:
  rebuild:
    if: github.repository == 'riccardopinato/Idee-app-Archivi-riferimenti'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Admit ML23 into canonical registry
        run: python3 scripts/admit_ml23_capabilities_20261104.py
      - name: Regenerate 160 capability app partitions
        run: python3 scripts/build_catalog.py
      - name: Canonical source checks
        run: |
          python3 scripts/build_catalog.py --check
          python3 -m unittest discover -s tests -p 'capability_registry_test.py' -v
          python3 -m unittest discover -s tests -p 'status_views_test.py' -v
          python3 -m unittest discover -s tests -p 'projects_sync_test.py' -v
      - name: Commit audited catalogue and all derived views
        run: |
          git config user.name "app-factory-audit[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 11-NUOVE-IDEE 12-CAPABILITY-E-IMPLEMENTAZIONI 13-KIT-INTEGRAZIONE README.md DA_VALUTARE.md GIA_INTEGRATI.md 09-AGGIORNAMENTI/CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "data(catalog): admit 10 ML capability engines and all 23 crosswalks"
            for attempt in 1 2 3 4; do
              if git push origin HEAD:feat/ml23-capabilities-golden-roadmap-20261104; then
                exit 0
              fi
              sleep $((attempt * 5))
            done
            echo "Failed to push generated catalog after bounded retries"
            exit 1
          fi
