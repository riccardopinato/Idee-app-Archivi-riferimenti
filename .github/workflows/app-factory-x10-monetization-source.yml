name: App Factory X10-024 — provider-neutral monetization Dart core
on:
  pull_request:
    paths:
      - "19-APP-FACTORY-10X/flutter_kits/monetization/**"
      - ".github/workflows/app-factory-x10-monetization-source.yml"
  push:
    branches: [main]
    paths:
      - "19-APP-FACTORY-10X/flutter_kits/monetization/**"
      - ".github/workflows/app-factory-x10-monetization-source.yml"
permissions:
  contents: read
jobs:
  pure-dart-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Analyze and test provider-free policy
        run: |
          set -euo pipefail
          cd 19-APP-FACTORY-10X/flutter_kits/monetization
          dart pub get
          dart analyze --fatal-infos
          dart test
      - name: Proof boundary
        run: |
          echo 'X10-024 SOURCE CANDIDATE ONLY; no store/provider monetization consent, SDK or purchase verification.' >> "$GITHUB_STEP_SUMMARY"
