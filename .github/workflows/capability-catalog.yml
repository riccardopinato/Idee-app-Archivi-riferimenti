name: Capability catalogue validation

on:
  push:
    branches: [main]
    paths:
      - "12-CAPABILITY-E-IMPLEMENTAZIONI/**"
      - "14-MACHINE-LEARNING/**"
      - "scripts/validate_ml_intake.py"
      - "scripts/build_catalog.py"
      - "scripts/build_status_views.py"
      - "scripts/projects_sync.py"
      - "tests/projects_sync_test.py"
      - ".github/workflows/app-factory-project-sync.yml"
      - "tests/status_views_test.py"
      - "11-NUOVE-IDEE/IA-2026-11-02/INTEGRATION_STATUS.json"
      - "11-NUOVE-IDEE/IA-2026-11-02/RANKING_100_COMPLETO.md"
      - "DA_VALUTARE.md"
      - "GIA_INTEGRATI.md"
      - ".github/workflows/capability-catalog.yml"
  pull_request:
    branches: [main]
    paths:
      - "12-CAPABILITY-E-IMPLEMENTAZIONI/**"
      - "14-MACHINE-LEARNING/**"
      - "scripts/validate_ml_intake.py"
      - "scripts/build_catalog.py"
      - "scripts/build_status_views.py"
      - "scripts/projects_sync.py"
      - "tests/projects_sync_test.py"
      - ".github/workflows/app-factory-project-sync.yml"
      - "tests/status_views_test.py"
      - "11-NUOVE-IDEE/IA-2026-11-02/INTEGRATION_STATUS.json"
      - "11-NUOVE-IDEE/IA-2026-11-02/RANKING_100_COMPLETO.md"
      - "DA_VALUTARE.md"
      - "GIA_INTEGRATI.md"
      - ".github/workflows/capability-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check registry and generated app views
        run: python3 scripts/build_catalog.py --check
      - name: Validate ML intake registry and links
        run: python3 scripts/validate_ml_intake.py
      - name: Test evidence state promotions
        run: python3 -m unittest discover -s tests -p 'capability_registry_test.py' -v
      - name: Test integration-vs-pending partition
        run: python3 -m unittest discover -s tests -p 'status_views_test.py' -v
      - name: Test optional GitHub Projects pilot/full mirror
        run: python3 -m unittest discover -s tests -p 'projects_sync_test.py' -v
      - name: Check whole-project export without credentials
        run: python3 scripts/projects_sync.py --mode dry-run
