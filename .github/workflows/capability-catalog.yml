name: Capability catalogue validation

on:
  push:
    branches: [main]
    paths:
      - "12-CAPABILITY-E-IMPLEMENTAZIONI/**"
      - "scripts/build_catalog.py"
      - ".github/workflows/capability-catalog.yml"
  pull_request:
    branches: [main]
    paths:
      - "12-CAPABILITY-E-IMPLEMENTAZIONI/**"
      - "scripts/build_catalog.py"
      - ".github/workflows/capability-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check registry and generated app views
        run: python3 scripts/build_catalog.py --check
