async function syncGitHub(isManual=false){
 const btn=$('#syncTop');if(btn)btn.disabled=true;updateSyncSignal('GitHub: controllo snapshot…');
 try{
  const rsp=await fetch(REMOTE_SNAPSHOT+'?v='+Date.now(),{cache:'no-store'});
  if(!rsp.ok)throw Error('HTTP '+rsp.status+'; snapshot non disponibile');
  const remote=await rsp.json();
  if(remote.schemaVersion!==1||!remote.data||typeof remote.data!=='object'||!remote.generatedAt||!remote.sourceRepository)throw Error('Schema snapshot non valido');
  let changed=0,protectedCount=0;const details=[];
  for(const c of SYNC_COLLECTIONS){
   const items=remote.data[c];if(items===undefined)continue;
   if(!Array.isArray(items))throw Error('Collezione invalida: '+c);
   if(!Array.isArray(db[c]))db[c]=[];
   for(const item of items){
    if(!item||!item.id)continue;
    const key=entryKey(c,item);const idx=db[c].findIndex(x=>entryKey(c,x)===key);
    if(db.manualProtected?.[c+'|'+key]){protectedCount++;continue;}
    if(idx<0){db[c].push(item);changed++;details.push(c+': +'+key)}
    else {
     const before=db[c][idx];const after={...before,...item};
     if(JSON.stringify(before)!==JSON.stringify(after)){
      // No automatic step advancement to high-assurance states without a proof URL, exact SHA and evidence status.
      const evidenceField=c==='capabilities'?'state':c==='projects'?'evidence':null;
      if(evidenceField&&['SOURCE_CONFIRMED','CI_VERIFIED','DEVICE_VERIFIED','RELEASE'].includes(after[evidenceField])&&!(after.url||after.evidence_url||after.evidenceUrl||after.source_sha))continue;
      db[c][idx]=after;changed++;details.push(c+': ~'+key)
     }
    }
   }
  }
  if(remote.data.repoObservations&&typeof remote.data.repoObservations==='object'){
   db.repoObservations??={};for(const [k,v] of Object.entries(remote.data.repoObservations)){
    if(!v?.sha)continue;
    if(JSON.stringify(db.repoObservations[k])!==JSON.stringify(v)){db.repoObservations[k]=v;changed++;details.push('repo: '+k)}
   }
  }
  if(remote.data.capabilityCounts&&typeof remote.data.capabilityCounts==='object')db.capabilityCounts=remote.data.capabilityCounts;
  if(Array.isArray(remote.data.passports)){
    if(JSON.stringify(db.passports||[])!==JSON.stringify(remote.data.passports)){
      db.passports=remote.data.passports;
      changed++;details.push('passports: registry sync');
    }
  }
  if(Array.isArray(remote.data.consumerMatrix))db.consumerMatrix=remote.data.consumerMatrix;
  if(remote.data.registryMetrics)db.registryMetrics=remote.data.registryMetrics;
  const oldSha=db.lastRemoteSync?.snapshot_sha||'';
  const newSha=remote.snapshot_sha||remote.factoryBaseline?.sha||remote.generatedAt;
  db.lastRemoteSync={fetchedAt:now(),publishedAt:remote.generatedAt,snapshot_sha:newSha,sourceRepository:remote.sourceRepository,changed,protectedCount,url:REMOTE_SNAPSHOT};
  if(changed||oldSha!==newSha){log('Sincronizzazione','Snapshot GitHub letto',`Fonte ${remote.sourceRepository}; ${changed} record allineati, ${protectedCount} protetti da modifica manuale. ${details.slice(0,8).join(', ')}${details.length>8?' …':''}`,{snapshot:oldSha},{snapshot:newSha,changed,protectedCount},'GitHub: snapshot remoto')}
  persist();render();updateSyncSignal('GitHub: dati '+new Date(remote.generatedAt).toLocaleDateString('it-IT'));
  if(isManual)alert(`Snapshot letto: ${changed} record aggiornati. ${protectedCount} modifiche manuali protette. Origine: ${remote.generatedAt}`)
 }catch(err){updateSyncSignal('GitHub: ultimo dato locale');if(isManual)alert('Sincronizzazione non riuscita. Il dataset locale resta invariato. '+err.message)}
 finally{if(btn)btn.disabled=false}
}

async function loadFleetStatus(){
 try{
  const rsp=await fetch(REMOTE_FLEET+'?v='+Date.now(),{cache:'no-store'});
  if(!rsp.ok)throw Error('HTTP '+rsp.status);
  const data=await rsp.json();
  if(data.schema_version!==1||!Array.isArray(data.repositories)||data.repositories.length!==35)throw Error('Schema flotta invalido');
  fleetData=data;fleetError=null;
 }catch(err){fleetError=String(err.message||err)}
 if(section==='repos')render();
}
function fleetTableRows(){

  const repo=r.repository||'Privato · identificativo nascosto';
  const source=r.source_url?link(r.source_url,'SHA '+r.last_checked_sha.slice(0,9)):'<span class="tiny">Sorgente riservata</span>';
  const run=r.last_snapshot_run?link(r.last_snapshot_run,'Run reale'):'<span class="tiny">Non eseguito / non osservato</span>';
  const pr=r.open_snapshot_pr?link(r.open_snapshot_pr,'PR bot'):'<span class="tiny">Nessuna PR bot verificata</span>';
  return '<tr><td><b>'+esc(repo)+'</b><div class="tiny">'+esc(r.workflow_version)+'</div></td><td>'+esc(r.default_branch||'riservato')+'</td><td>'+stateBadge(r.state)+'</td><td>'+source+'</td><td>'+run+'</td><td>'+pr+'</td></tr>';
 });
}

$('#syncTop').onclick=()=>syncGitHub(true);$('#quickAdd').onclick=()=>edit(({overview:'projects',repos:'projects',goldens:'reusable',updates:'projects',settings:'projects'})[section]||({ideas:'ideaItems',capabilities:'capabilities',blockers:'blockers',roadmap:'roadmap',reuse:'reusable',projects:'projects'})[section]||'projects');$('#themeBtn').onclick=()=>{db.preferences.dark=!db.preferences.dark;log('Preferenze','Tema modificato',db.preferences.dark?'Tema scuro':'Tema chiaro');persist();render()};$('#hamb').onclick=()=>$('#sidebar').classList.toggle('open');$('#modalBack').addEventListener('click',e=>{if(e.target===$('#modalBack'))closeModal()});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();syncGitHub(false);loadFleetStatus();
