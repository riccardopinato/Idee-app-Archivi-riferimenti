name: factory_notification_flutter_adapter
description: Android Flutter plugin-backed adapter for the App Factory notification policy, not a device certificate.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  factory_notification_kit:
    path: ../notifications
  flutter_local_notifications: 22.3.1
  timezone: 0.11.0
  crypto: ^3.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
